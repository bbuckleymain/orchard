<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="body" cx="42%" cy="34%" r="72%">
      <stop offset="0" stop-color="#d8ff9c"/>
      <stop offset=".45" stop-color="#6fd23c"/>
      <stop offset="1" stop-color="#1f7a1c"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="85%" r="50%">
      <stop offset="0" stop-color="#bfffe0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#bfffe0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8f06a"/>
      <stop offset="1" stop-color="#2e9a2a"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#003a10" stop-opacity=".35"/>
      <stop offset="1" stop-color="#003a10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="128" cy="236" rx="78" ry="12" fill="url(#shadow)"/>

  <!-- stem and leaf -->
  <path d="M128 70 C127 52 132 38 142 26" fill="none" stroke="#5a3a1a" stroke-width="9" stroke-linecap="round"/>
  <path d="M140 46 C156 22 190 18 206 30 C192 54 162 62 140 46 Z" fill="url(#leaf)" stroke="#1f6a1c" stroke-width="2.5"/>
  <path d="M146 44 C164 38 182 34 198 32" fill="none" stroke="#e8ffd0" stroke-opacity=".7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- apple -->
  <path d="M128 72
           C108 58 66 56 46 86
           C24 120 34 178 62 210
           C80 230 104 232 128 220
           C152 232 176 230 194 210
           C222 178 232 120 210 86
           C190 56 148 58 128 72 Z"
        fill="url(#body)" stroke="#16601a" stroke-width="3"/>
  <!-- reflected light from below -->
  <path d="M62 200 C90 226 166 226 194 200 C176 222 80 222 62 200 Z" fill="url(#glow)"/>
  <!-- glass highlight -->
  <path d="M60 104 C66 82 92 72 116 82 C130 88 140 88 154 82 C178 72 200 86 202 110
           C170 98 90 98 60 104 Z" fill="url(#gloss)"/>

  <!-- music note -->
  <g fill="#fff" stroke="#14581a" stroke-opacity=".35" stroke-width="2">
    <path d="M114 112 L170 100 L170 176 A16 13 -12 1 1 156 162 L156 126 L128 132 L128 188 A16 13 -12 1 1 114 174 Z"/>
  </g>
</svg>
