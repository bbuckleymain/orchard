name: Orchard CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The tests are pure Node (no Electron, no network). --ignore-scripts keeps npm from downloading the
      # castLabs Electron binary, which the suite never loads.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
